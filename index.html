<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Market">
<meta name="theme-color" content="#FAF6EE">
<title>Market list</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232F5D3F'/%3E%3Cpath d='M28 38h44l-4 36a4 4 0 01-4 3.5H36a4 4 0 01-4-3.5L28 38z' fill='none' stroke='%23FAF6EE' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M38 38v-6a12 12 0 0124 0v6' fill='none' stroke='%23FAF6EE' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232F5D3F'/%3E%3Cpath d='M28 38h44l-4 36a4 4 0 01-4 3.5H36a4 4 0 01-4-3.5L28 38z' fill='none' stroke='%23FAF6EE' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M38 38v-6a12 12 0 0124 0v6' fill='none' stroke='%23FAF6EE' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF6EE;
  --bg-card: #FFFBF3;
  --ink: #2A2724;
  --ink-soft: #6B5F4F;
  --ink-faint: #A89888;
  --line: #E8DFCB;
  --line-strong: #D9CCB0;
  --green: #2F5D3F;
  --green-soft: #E1EBDC;
  --terra: #C26847;
  --terra-soft: #F5E0D4;
  --shadow: 0 1px 2px rgba(74,55,32,0.04), 0 6px 20px rgba(74,55,32,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  font-size: 25.6px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body {
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(196,168,69,0.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(47,93,63,0.04) 0%, transparent 50%);
}

header {
  padding: calc(env(safe-area-inset-top) + 18px) 20px 14px;
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}

.title-block { flex: 1; min-width: 0; }

.title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 48px;
  letter-spacing: -0.025em;
  line-height: 1;
}

.title .accent {
  font-style: italic;
  color: var(--green);
  font-weight: 500;
}

.subtitle {
  font-size: 20.8px;
  color: var(--ink-soft);
  margin-top: 5px;
  letter-spacing: 0.01em;
}

main {
  flex: 1;
  padding: 8px 20px 20px;
  position: relative;
  z-index: 1;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.add-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  align-items: center;
}

.add-bar input[type="text"] {
  flex: 1;
  min-width: 0;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px;
  font-family: inherit;
  font-size: 25.6px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}

.add-bar input[type="text"]:focus { border-color: var(--green); }
.add-bar input[type="text"]::placeholder { color: var(--ink-faint); }

.add-bar select {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 28px 13px 12px;
  font-family: inherit;
  font-size: 20.8px;
  font-weight: 500;
  color: var(--ink-soft);
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1L5 5L9 1' stroke='%236B5F4F' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  max-width: 110px;
}

.btn-add {
  background: var(--green);
  color: #FFFBF3;
  border: none;
  border-radius: 12px;
  width: 46px;
  height: 46px;
  font-size: 41.6px;
  font-weight: 300;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  transition: transform 0.1s, background 0.2s;
}

.btn-add:active { transform: scale(0.94); background: #234830; }

.category { margin-bottom: 22px; }

.category-label {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 24px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 8px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.category-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

.list { list-style: none; display: flex; flex-direction: column; gap: 7px; }

.item {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 12px 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s;
}

.item.in-week {
  border-color: var(--green-soft);
  background: linear-gradient(to right, var(--bg-card), #F7FAF4);
}

.item-name {
  flex: 1;
  font-size: 24.8px;
  font-weight: 500;
  letter-spacing: -0.005em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.qty-pill {
  font-variant-numeric: tabular-nums;
  font-size: 19.2px;
  font-weight: 700;
  color: var(--green);
  background: var(--green-soft);
  padding: 3px 8px;
  border-radius: 100px;
  flex-shrink: 0;
}

.item-action {
  background: var(--green-soft);
  color: var(--green);
  border: none;
  border-radius: 10px;
  width: 36px;
  height: 36px;
  font-size: 35.2px;
  font-weight: 400;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  transition: all 0.15s;
}

.item-action:active { transform: scale(0.9); }

.item-action.danger {
  background: transparent;
  color: var(--ink-faint);
  width: 32px;
  font-size: 35.2px;
}
.item-action.danger:active { color: var(--terra); }
.item-action.danger.armed { color: var(--terra); background: var(--terra-soft); }

.qty-controls {
  display: flex;
  align-items: center;
  background: var(--bg);
  border-radius: 10px;
  padding: 3px;
  border: 1px solid var(--line);
  flex-shrink: 0;
}

.qty-btn {
  background: transparent;
  border: none;
  width: 32px;
  height: 30px;
  font-size: 28.8px;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.qty-btn:active { background: var(--line); }

.qty-value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 24px;
  min-width: 22px;
  text-align: center;
  color: var(--ink);
}

.shop-item {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.25s;
}

.shop-item:active { transform: scale(0.99); }

.shop-item .check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--line-strong);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.shop-item.checked {
  background: var(--green-soft);
  border-color: var(--green-soft);
}

.shop-item.checked .check {
  background: var(--green);
  border-color: var(--green);
}

.shop-item.checked .check::after {
  content: '';
  width: 11px;
  height: 6px;
  border-left: 2.5px solid #FFFBF3;
  border-bottom: 2.5px solid #FFFBF3;
  transform: rotate(-45deg) translate(1px, -1px);
}

.shop-item.checked .item-name {
  text-decoration: line-through;
  color: var(--ink-soft);
}

.shop-item .qty-badge {
  font-variant-numeric: tabular-nums;
  font-size: 20.8px;
  color: var(--ink-soft);
  background: var(--bg);
  padding: 4px 10px;
  border-radius: 100px;
  font-weight: 700;
  border: 1px solid var(--line);
  flex-shrink: 0;
}

.shop-item.checked .qty-badge { opacity: 0.5; }

.progress-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
}

.progress-label {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 27.2px;
  color: var(--ink);
  flex: 1;
  min-width: 0;
}

.progress-stat {
  font-variant-numeric: tabular-nums;
  font-size: 22.4px;
  font-weight: 700;
  color: var(--green);
  flex-shrink: 0;
}

.progress-bar {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green) 0%, #4A7D5C 100%);
  border-radius: 3px;
  transition: width 0.4s ease;
}

.week-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 12px;
}

.week-header-text { flex: 1; min-width: 0; }

.week-header-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 30.4px;
  color: var(--ink);
}

.week-header-sub {
  font-size: 19.2px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.empty {
  text-align: center;
  padding: 50px 20px 30px;
  color: var(--ink-soft);
}

.empty-icon {
  font-size: 67.2px;
  margin-bottom: 14px;
  opacity: 0.6;
}

.empty-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 32px;
  margin-bottom: 8px;
  color: var(--ink);
}

.empty-text {
  font-size: 22.4px;
  line-height: 1.55;
  max-width: 280px;
  margin: 0 auto;
}

.empty-text strong { color: var(--green); font-weight: 700; }

.tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 251, 243, 0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-around;
  z-index: 100;
  max-width: 480px;
  margin: 0 auto;
}

.tab {
  background: transparent;
  border: none;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--ink-faint);
  cursor: pointer;
  flex: 1;
  border-radius: 12px;
  font-family: inherit;
  transition: color 0.2s;
  position: relative;
}

.tab.active { color: var(--green); }
.tab:active { background: rgba(0,0,0,0.03); }

.tab-icon { width: 22px; height: 22px; }

.tab-label {
  font-size: 17.6px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.tab-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 22px);
  background: var(--terra);
  color: #FFFBF3;
  font-size: 16px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}

.icon-btn {
  background: var(--bg-card);
  border: 1px solid var(--line);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink-soft);
  flex-shrink: 0;
  transition: all 0.15s;
}

.icon-btn:active { background: var(--line); transform: scale(0.94); }
.icon-btn.confirming {
  background: var(--terra-soft);
  color: var(--terra);
  border-color: var(--terra-soft);
}

.toast {
  position: fixed;
  bottom: calc(100px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink);
  color: #FFFBF3;
  padding: 11px 18px;
  border-radius: 100px;
  font-size: 22.4px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.25s ease;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.celebrate {
  text-align: center;
  padding: 30px 20px 20px;
}

.celebrate-emoji {
  font-size: 89.6px;
  margin-bottom: 14px;
  animation: bounce 0.6s ease;
}

@keyframes bounce {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

.celebrate-title {
  font-family: 'Fraunces', serif;
  font-size: 41.6px;
  color: var(--green);
  margin-bottom: 8px;
  font-style: italic;
  font-weight: 600;
}

.celebrate-text {
  color: var(--ink-soft);
  font-size: 24px;
  margin-bottom: 22px;
}

.celebrate-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-primary {
  background: var(--green);
  color: #FFFBF3;
  border: none;
  padding: 13px 22px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 22.4px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}

.btn-primary:active { transform: scale(0.96); background: #234830; }

.btn-secondary {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line-strong);
  padding: 12px 22px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 20.8px;
  font-weight: 600;
  cursor: pointer;
}

.btn-secondary:active { background: var(--line); }

/* Settings menu */
.menu-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(42, 39, 36, 0.4);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.menu-backdrop.show { opacity: 1; pointer-events: auto; }

.menu-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  z-index: 301;
  padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
  max-width: 480px;
  margin: 0 auto;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
}

.menu-sheet.show { transform: translateY(0); }

.menu-grip {
  width: 36px;
  height: 4px;
  background: var(--line-strong);
  border-radius: 2px;
  margin: 0 auto 18px;
}

.menu-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 32px;
  margin-bottom: 16px;
  color: var(--ink);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  color: var(--ink);
  font-size: 24px;
  font-weight: 500;
  background: none;
  border-left: none;
  border-right: none;
  border-top: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--bg-card); }

.menu-item svg {
  width: 20px;
  height: 20px;
  color: var(--ink-soft);
  flex-shrink: 0;
}

.menu-item .label { flex: 1; }
.menu-item .hint { font-size: 19.2px; color: var(--ink-faint); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1 class="title">Market <span class="accent">list</span></h1>
    <p class="subtitle" id="subtitle">Loading…</p>
  </div>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
    </svg>
  </button>
</header>

<main>
  <section class="view active" id="view-pantry">
    <div class="add-bar">
      <input type="text" id="newItemName" placeholder="Add to pantry…" maxlength="60" autocomplete="off" autocorrect="off">
      <select id="newItemCategory" aria-label="Category"></select>
      <button class="btn-add" id="addItemBtn" aria-label="Add">+</button>
    </div>
    <div id="pantryList"></div>
  </section>

  <section class="view" id="view-week">
    <div id="weekList"></div>
  </section>

  <section class="view" id="view-shop">
    <div id="shopContent"></div>
  </section>
</main>

<nav class="tabs">
  <button class="tab active" data-view="pantry">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8h14M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M5 8L7 4h10l2 4M9 12v4M15 12v4"/>
    </svg>
    <span class="tab-label">PANTRY</span>
  </button>
  <button class="tab" data-view="week">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="16" rx="2"/>
      <path d="M16 3v4M8 3v4M3.5 10h17"/>
    </svg>
    <span class="tab-label">THIS WEEK</span>
    <span class="tab-badge" id="weekBadge" style="display:none">0</span>
  </button>
  <button class="tab" data-view="shop">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4h2l2.5 12.5a2 2 0 002 1.5h7.5a2 2 0 002-1.5L21 7H6"/>
      <circle cx="9" cy="21" r="1.5"/>
      <circle cx="18" cy="21" r="1.5"/>
    </svg>
    <span class="tab-label">SHOP</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="menu-sheet" id="menuSheet">
  <div class="menu-grip"></div>
  <div class="menu-title">Backup & restore</div>
  <button class="menu-item" id="exportBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    </svg>
    <span class="label">Export data</span>
    <span class="hint">save backup</span>
  </button>
  <button class="menu-item" id="importBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </svg>
    <span class="label">Import data</span>
    <span class="hint">restore backup</span>
  </button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
</div>

<script>
  const CATEGORIES = ['Produce','Dairy','Bakery','Pantry','Frozen','Drinks','Indian','Household','Other'];
  const STORAGE_MASTER = 'market_master_v1';
  const STORAGE_WEEK = 'market_week_v1';

  let masterList = [];
  let weekList = [];
  let currentView = 'pantry';
  let clearWeekArmed = false;
  let deleteArmedId = null;
  let armTimeout = null;

  const catSelect = document.getElementById('newItemCategory');
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });

  function loadData() {
    try {
      const m = localStorage.getItem(STORAGE_MASTER);
      if (m) masterList = JSON.parse(m);
    } catch (e) { masterList = []; }
    try {
      const w = localStorage.getItem(STORAGE_WEEK);
      if (w) weekList = JSON.parse(w);
    } catch (e) { weekList = []; }
  }

  function saveMaster() {
    try { localStorage.setItem(STORAGE_MASTER, JSON.stringify(masterList)); }
    catch (e) { showToast("Couldn't save"); }
  }

  function saveWeek() {
    try { localStorage.setItem(STORAGE_WEEK, JSON.stringify(weekList)); }
    catch (e) { showToast("Couldn't save"); }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 1500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function updateBadge() {
    const badge = document.getElementById('weekBadge');
    if (weekList.length > 0) {
      badge.textContent = weekList.length;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  function groupByCategory(list) {
    const byCat = {};
    list.forEach(item => {
      const c = item.category || 'Other';
      if (!byCat[c]) byCat[c] = [];
      byCat[c].push(item);
    });
    return byCat;
  }

  function disarmAll() {
    clearWeekArmed = false;
    deleteArmedId = null;
    clearTimeout(armTimeout);
  }

  function renderPantry() {
    const container = document.getElementById('pantryList');
    if (masterList.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🌾</div>
          <div class="empty-title">Stock your pantry</div>
          <div class="empty-text">Add things you buy regularly — milk, apples, bread, coffee. This is your master list.</div>
        </div>`;
      return;
    }
    const byCat = groupByCategory(masterList);
    const weekIds = new Set(weekList.map(w => w.id));
    const weekQty = {};
    weekList.forEach(w => weekQty[w.id] = w.quantity);

    let html = '';
    CATEGORIES.forEach(cat => {
      if (!byCat[cat]) return;
      html += `<div class="category"><div class="category-label">${cat}</div><ul class="list">`;
      byCat[cat].sort((a,b) => a.name.localeCompare(b.name)).forEach(item => {
        const inWeek = weekIds.has(item.id);
        const armed = deleteArmedId === item.id;
        html += `<li class="item ${inWeek ? 'in-week' : ''}">
          <span class="item-name">${escapeHtml(item.name)}</span>
          ${inWeek ? `<span class="qty-pill">×${weekQty[item.id]}</span>` : ''}
          <button class="item-action danger ${armed ? 'armed' : ''}" data-act="delete" data-id="${item.id}" aria-label="Remove from pantry">${armed ? '✓' : '×'}</button>
          <button class="item-action" data-act="add-to-week" data-id="${item.id}" aria-label="Add to week">+</button>
        </li>`;
      });
      html += `</ul></div>`;
    });
    container.innerHTML = html;
  }

  function renderWeek() {
    const container = document.getElementById('weekList');
    if (weekList.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📝</div>
          <div class="empty-title">Nothing for this week</div>
          <div class="empty-text">Head to <strong>Pantry</strong> and tap <strong>+</strong> on items you need this week.</div>
        </div>`;
      return;
    }
    const totalQty = weekList.reduce((s, i) => s + i.quantity, 0);
    let html = `<div class="week-header">
      <div class="week-header-text">
        <div class="week-header-title">${weekList.length} item${weekList.length === 1 ? '' : 's'}, ${totalQty} total</div>
        <div class="week-header-sub">${clearWeekArmed ? 'Tap again to clear week' : 'Adjust quantities below'}</div>
      </div>
      <button class="icon-btn ${clearWeekArmed ? 'confirming' : ''}" id="clearWeekBtn" aria-label="Clear week">
        ${clearWeekArmed
          ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>`
        }
      </button>
    </div>`;
    const byCat = groupByCategory(weekList);
    CATEGORIES.forEach(cat => {
      if (!byCat[cat]) return;
      html += `<div class="category"><div class="category-label">${cat}</div><ul class="list">`;
      byCat[cat].sort((a,b) => a.name.localeCompare(b.name)).forEach(item => {
        html += `<li class="item">
          <span class="item-name">${escapeHtml(item.name)}</span>
          <div class="qty-controls">
            <button class="qty-btn" data-act="qty-down" data-id="${item.id}" aria-label="Decrease">−</button>
            <span class="qty-value">${item.quantity}</span>
            <button class="qty-btn" data-act="qty-up" data-id="${item.id}" aria-label="Increase">+</button>
          </div>
        </li>`;
      });
      html += `</ul></div>`;
    });
    container.innerHTML = html;
  }

  function renderShop() {
    const container = document.getElementById('shopContent');
    if (weekList.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🛒</div>
          <div class="empty-title">Empty cart</div>
          <div class="empty-text">Build this week's list first, then come back here to check items off.</div>
        </div>`;
      return;
    }
    const checked = weekList.filter(i => i.checked).length;
    const total = weekList.length;
    const pct = total === 0 ? 0 : Math.round((checked / total) * 100);

    if (checked === total) {
      container.innerHTML = `
        <div class="progress-card">
          <div class="progress-top">
            <div class="progress-label">All done</div>
            <div class="progress-stat">${checked} / ${total}</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
        </div>
        <div class="celebrate">
          <div class="celebrate-emoji">🎉</div>
          <div class="celebrate-title">Cart's full</div>
          <div class="celebrate-text">Everything's checked off. Nice trip.</div>
          <div class="celebrate-actions">
            <button class="btn-primary" id="resetShopBtn">Uncheck all</button>
            <button class="btn-secondary" id="clearAfterShopBtn">Clear week</button>
          </div>
        </div>`;
      return;
    }

    const byCat = groupByCategory(weekList);
    let html = `<div class="progress-card">
      <div class="progress-top">
        <div class="progress-label">Shopping</div>
        <div class="progress-stat">${checked} / ${total}</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

    CATEGORIES.forEach(cat => {
      if (!byCat[cat]) return;
      const sorted = [...byCat[cat]].sort((a, b) => {
        if (a.checked !== b.checked) return a.checked ? 1 : -1;
        return a.name.localeCompare(b.name);
      });
      html += `<div class="category"><div class="category-label">${cat}</div><ul class="list">`;
      sorted.forEach(item => {
        html += `<li class="shop-item ${item.checked ? 'checked' : ''}" data-act="toggle" data-id="${item.id}">
          <div class="check"></div>
          <span class="item-name">${escapeHtml(item.name)}</span>
          <span class="qty-badge">×${item.quantity}</span>
        </li>`;
      });
      html += `</ul></div>`;
    });
    container.innerHTML = html;
  }

  function addToMaster() {
    const input = document.getElementById('newItemName');
    const cat = document.getElementById('newItemCategory').value;
    const name = input.value.trim();
    if (!name) return;
    if (masterList.some(i => i.name.toLowerCase() === name.toLowerCase())) {
      showToast(`"${name}" already in pantry`);
      input.value = '';
      return;
    }
    masterList.push({ id: uid(), name, category: cat });
    input.value = '';
    saveMaster();
    renderPantry();
  }

  function deleteFromMaster(id) {
    if (deleteArmedId === id) {
      const item = masterList.find(i => i.id === id);
      masterList = masterList.filter(i => i.id !== id);
      weekList = weekList.filter(i => i.id !== id);
      disarmAll();
      saveMaster();
      saveWeek();
      updateBadge();
      renderPantry();
      if (item) showToast(`Removed ${item.name}`);
    } else {
      disarmAll();
      deleteArmedId = id;
      renderPantry();
      armTimeout = setTimeout(() => {
        if (deleteArmedId === id) {
          deleteArmedId = null;
          renderPantry();
        }
      }, 2200);
    }
  }

  function addToWeek(id) {
    const masterItem = masterList.find(i => i.id === id);
    if (!masterItem) return;
    const existing = weekList.find(i => i.id === id);
    if (existing) {
      existing.quantity += 1;
      showToast(`${masterItem.name} ×${existing.quantity}`);
    } else {
      weekList.push({
        id: masterItem.id,
        name: masterItem.name,
        category: masterItem.category,
        quantity: 1,
        checked: false
      });
      showToast(`Added ${masterItem.name}`);
    }
    saveWeek();
    updateBadge();
    renderPantry();
  }

  function adjustQty(id, delta) {
    const item = weekList.find(i => i.id === id);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) {
      weekList = weekList.filter(i => i.id !== id);
    }
    saveWeek();
    updateBadge();
    renderWeek();
  }

  function toggleCheck(id) {
    const item = weekList.find(i => i.id === id);
    if (!item) return;
    item.checked = !item.checked;
    saveWeek();
    renderShop();
  }

  function clearWeek() {
    if (weekList.length === 0) return;
    if (clearWeekArmed) {
      weekList = [];
      disarmAll();
      saveWeek();
      updateBadge();
      renderWeek();
      showToast("Week cleared");
    } else {
      disarmAll();
      clearWeekArmed = true;
      renderWeek();
      armTimeout = setTimeout(() => {
        if (clearWeekArmed) {
          clearWeekArmed = false;
          if (currentView === 'week') renderWeek();
        }
      }, 2500);
    }
  }

  function resetShop() {
    weekList.forEach(i => i.checked = false);
    saveWeek();
    renderShop();
    showToast("Reset");
  }

  function clearAfterShop() {
    weekList = [];
    saveWeek();
    updateBadge();
    renderShop();
    showToast("Week cleared");
  }

  function switchView(view) {
    currentView = view;
    disarmAll();
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.view === view);
    });
    const subtitles = {
      pantry: 'Your master list',
      week: "What you need this week",
      shop: 'Tap items to check off'
    };
    document.getElementById('subtitle').textContent = subtitles[view];
    if (view === 'pantry') renderPantry();
    if (view === 'week') renderWeek();
    if (view === 'shop') renderShop();
  }

  // ---- Menu ----
  function openMenu() {
    document.getElementById('menuBackdrop').classList.add('show');
    document.getElementById('menuSheet').classList.add('show');
  }
  function closeMenu() {
    document.getElementById('menuBackdrop').classList.remove('show');
    document.getElementById('menuSheet').classList.remove('show');
  }

  function exportData() {
    const data = {
      version: 1,
      exported: new Date().toISOString(),
      master: masterList,
      week: weekList
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `market-list-backup-${date}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    closeMenu();
    showToast("Backup downloaded");
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data.master) || !Array.isArray(data.week)) {
          throw new Error('invalid');
        }
        // Remap any category not in current list to 'Other'
        masterList = data.master.map(item => ({
          ...item,
          category: CATEGORIES.includes(item.category) ? item.category : 'Other'
        }));
        weekList = data.week.map(item => ({
          ...item,
          category: CATEGORIES.includes(item.category) ? item.category : 'Other'
        }));
        saveMaster();
        saveWeek();
        updateBadge();
        closeMenu();
        switchView('pantry');
        showToast("Data restored — " + masterList.length + " items");
      } catch (err) {
        showToast("Couldn't read file");
      }
    };
    reader.readAsText(file);
  }

  // ---- Events ----
  document.addEventListener('click', e => {
    const isActionable = e.target.closest('[data-act], #clearWeekBtn, #resetShopBtn, #clearAfterShopBtn, .tab, #addItemBtn, #menuBtn, .menu-sheet, #menuBackdrop');

    const target = e.target.closest('[data-act]');
    if (target) {
      const id = target.dataset.id;
      const act = target.dataset.act;
      if (act === 'delete') { deleteFromMaster(id); return; }
      if (act === 'add-to-week') { addToWeek(id); return; }
      if (act === 'qty-up') { adjustQty(id, 1); return; }
      if (act === 'qty-down') { adjustQty(id, -1); return; }
      if (act === 'toggle') { toggleCheck(id); return; }
    }

    if (e.target.id === 'addItemBtn') { addToMaster(); return; }
    const tabBtn = e.target.closest('.tab');
    if (tabBtn) { switchView(tabBtn.dataset.view); return; }
    if (e.target.closest('#clearWeekBtn')) { clearWeek(); return; }
    if (e.target.id === 'resetShopBtn') { resetShop(); return; }
    if (e.target.id === 'clearAfterShopBtn') { clearAfterShop(); return; }

    if (e.target.closest('#menuBtn')) { openMenu(); return; }
    if (e.target.id === 'menuBackdrop') { closeMenu(); return; }
    if (e.target.closest('#exportBtn')) { exportData(); return; }
    if (e.target.closest('#importBtn')) { document.getElementById('importFile').click(); return; }

    if (!isActionable && (clearWeekArmed || deleteArmedId)) {
      disarmAll();
      if (currentView === 'pantry') renderPantry();
      if (currentView === 'week') renderWeek();
    }
  });

  document.getElementById('newItemName').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addToMaster();
    }
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) importData(file);
    e.target.value = '';
  });

  (function init() {
    loadData();
    updateBadge();
    document.getElementById('subtitle').textContent = 'Your master list';
    renderPantry();
  })();
</script>
</body>
</html>
